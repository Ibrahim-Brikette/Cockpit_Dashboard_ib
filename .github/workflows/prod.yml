name: Production CI/CD

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: moezkr/cockpit-dashboard-frontend
  BACKEND_IMAGE_NAME: moezkr/cockpit-dashboard-backend

jobs:
  promote-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Promote Backend Image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:staging
          docker tag ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:staging ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:staging ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Promote Frontend Image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:staging
          docker tag ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:staging ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          docker tag ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:staging ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}

  create-release:
    needs: promote-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          generate_release_notes: true

  deploy-prod:
    needs: promote-images
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /root/Cockpit-dashboard-prod
            cd /root/Cockpit-dashboard-prod
            
            if [ ! -d ".git" ]; then
              git clone -b main https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
            fi
            
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            export VAULT_TOKEN="${{ secrets.VAULT_TOKEN }}"
            docker compose -f docker-compose.prod.yml pull
            VAULT_TOKEN="${{ secrets.VAULT_TOKEN }}" docker compose -f docker-compose.prod.yml up -d --remove-orphans
