<!-- Theme toggle -->
<button
  (click)="toggleTheme()"
  [attr.aria-label]="isDark ? 'Mode clair' : 'Mode sombre'"
  class="fixed top-4 right-4 z-50 flex h-8 w-8 items-center justify-center
         rounded-md border border-line dark:border-zinc-700
         bg-white dark:bg-zinc-800 text-ink-faint dark:text-zinc-400
         hover:text-ink dark:hover:text-white transition-colors shadow-card"
>
  <!-- Moon (light mode → switch to dark) -->
  <svg *ngIf="!isDark" class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <!-- Sun (dark mode → switch to light) -->
  <svg *ngIf="isDark" class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
</button>

<!-- Toast -->
<div
  *ngIf="toast"
  class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2.5
         rounded-lg border border-negative/20 bg-white dark:bg-zinc-900
         px-4 py-2.5 shadow-pop text-xs text-negative min-w-[260px] max-w-xs"
>
  <svg class="h-3.5 w-3.5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>
  <span class="flex-1">{{ toast }}</span>
  <button (click)="dismissToast()" class="text-negative/60 hover:text-negative transition-colors">
    <svg class="h-3 w-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>

<div class="min-h-screen flex items-center justify-center bg-surface-muted dark:bg-black px-4 transition-colors">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="mb-8 flex flex-col items-center gap-2">
      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-brand text-white shadow-card">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
      </div>
      <div class="text-center">
        <h1 class="text-sm font-semibold text-ink dark:text-white">CockpitNG</h1>
        <p class="text-2xs text-ink-faint dark:text-zinc-400">ProgesCode</p>
      </div>
    </div>

    <!-- Card -->
    <div class="rounded-lg border border-line dark:border-zinc-800 bg-white dark:bg-zinc-900 p-6 shadow-card">
      <h2 class="mb-1 text-sm font-semibold text-ink dark:text-white">Connexion</h2>
      <p class="mb-5 text-2xs text-ink-faint dark:text-zinc-400">
        Entrez vos identifiants pour accéder à votre espace.
      </p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-4">

        <!-- Username -->
        <div>
          <label class="mb-1 block text-xs font-medium text-ink-soft dark:text-zinc-300">Identifiant</label>
          <input
            formControlName="username"
            type="text"
            autocomplete="username"
            placeholder="Votre nom d'utilisateur"
            class="h-8 w-full rounded-md border px-2.5 text-xs outline-none transition-colors
                   bg-surface-muted dark:bg-zinc-800 text-ink dark:text-white
                   placeholder:text-ink-faint dark:placeholder:text-zinc-500
                   focus:ring-1 focus:ring-brand focus:border-brand"
            [class.border-negative]="fieldError('username','required')"
            [class.border-line-strong]="!fieldError('username','required')"
            [class.dark:border-zinc-700]="!fieldError('username','required')"
          />
          <p *ngIf="fieldError('username','required')" class="mt-1 text-2xs text-negative">
            L'identifiant est requis.
          </p>
        </div>

        <!-- Password -->
        <div>
          <div class="mb-1 flex items-center justify-between">
            <label class="text-xs font-medium text-ink-soft dark:text-zinc-300">Mot de passe</label>
            <a routerLink="/auth/mot-de-passe-oublie"
               class="text-2xs text-brand hover:text-brand-strong transition-colors">
              Mot de passe oublié ?
            </a>
          </div>
          <div class="relative">
            <input
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="current-password"
              placeholder="••••••••"
              class="h-8 w-full rounded-md border pr-9 pl-2.5 text-xs outline-none transition-colors
                     bg-surface-muted dark:bg-zinc-800 text-ink dark:text-white
                     placeholder:text-ink-faint dark:placeholder:text-zinc-500
                     focus:ring-1 focus:ring-brand focus:border-brand"
              [class.border-negative]="fieldError('password','required') || fieldError('password','minlength')"
              [class.border-line-strong]="!fieldError('password','required') && !fieldError('password','minlength')"
              [class.dark:border-zinc-700]="!fieldError('password','required') && !fieldError('password','minlength')"
            />
            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute right-2.5 top-1/2 -translate-y-1/2 text-ink-faint dark:text-zinc-400
                     hover:text-ink dark:hover:text-white transition-colors"
              [attr.aria-label]="showPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
            >
              <!-- Eye open -->
              <svg *ngIf="!showPassword" class="h-3.5 w-3.5" xmlns="http://www.w3.org/2000/svg"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- Eye off -->
              <svg *ngIf="showPassword" class="h-3.5 w-3.5" xmlns="http://www.w3.org/2000/svg"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <p *ngIf="fieldError('password','required')" class="mt-1 text-2xs text-negative">
            Le mot de passe est requis.
          </p>
          <p *ngIf="fieldError('password','minlength')" class="mt-1 text-2xs text-negative">
            Au moins 8 caractères requis.
          </p>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="loading"
          class="flex h-8 w-full items-center justify-center gap-2 rounded-md bg-brand
                 text-xs font-medium text-white hover:bg-brand-strong
                 disabled:opacity-60 disabled:cursor-not-allowed transition-colors"
        >
          <svg *ngIf="loading" class="h-3.5 w-3.5 animate-spin" xmlns="http://www.w3.org/2000/svg"
               fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          {{ loading ? 'Connexion…' : 'Se connecter' }}
        </button>

      </form>
    </div>
  </div>
</div>
