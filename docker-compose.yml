name: cockpit-local

services:
  postgres:
    image: postgres:18-alpine
    container_name: local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5450:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql
      - ./backend/src/main/resources/db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - local-net

  redis:
    image: redis:7-alpine
    container_name: local-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - local-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: local-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      COCKPIT_DB_URL: jdbc:postgresql://postgres:5432/cockpit
      COCKPIT_DB_USER: postgres
      COCKPIT_DB_PASSWORD: postgres
      COCKPIT_ALLOWED_ORIGINS: "*"
      COCKPIT_JWT_ISSUER: "http://localhost:8081/realms/cockpit"
      COCKPIT_SERVER_PORT: 8080
      VAULT_URI: "http://vault:8200"
      VAULT_TOKEN: "root"
    networks:
      - local-net

  vault:
    image: hashicorp/vault:1.15
    container_name: local-vault
    user: "0:0"
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev
    networks:
      - local-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: local-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - local-net

networks:
  local-net:
    driver: bridge

volumes:
  local_postgres_data:
