name: prestacode-prod

services:
  postgres:
    image: postgres:18-alpine
    container_name: prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: cockpit
    volumes:
      - prod_postgres_data:/var/lib/postgresql
      - ./backend/src/main/resources/db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d cockpit"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - prod-net

  redis:
    image: redis:7-alpine
    container_name: prod-redis
    restart: unless-stopped
    networks:
      - prod-net

  backend:
    image: ghcr.io/moezkr/cockpit-dashboard-backend:latest
    container_name: prod-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      REDIS_HOST: redis
      COCKPIT_DB_URL: jdbc:postgresql://postgres:5432/cockpit
      COCKPIT_DB_USER: ${POSTGRES_USER:-postgres}
      COCKPIT_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      COCKPIT_ALLOWED_ORIGINS: ${COCKPIT_ALLOWED_ORIGINS:-https://moezkr.site}
      COCKPIT_JWT_ISSUER: ${COCKPIT_JWT_ISSUER:-http://localhost:8081/realms/cockpit}
      COCKPIT_SERVER_PORT: 8080
      VAULT_URI: ${VAULT_URI:-http://cockpit_vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
    ports:
      - "127.0.0.1:8081:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prod-net

  frontend:
    image: ghcr.io/moezkr/cockpit-dashboard-frontend:latest
    container_name: prod-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:4201:80"
    networks:
      - prod-net

networks:
  prod-net:
    driver: bridge

volumes:
  prod_postgres_data: