name: prestacode-staging

services:
  postgres:
    image: postgres:18-alpine
    container_name: staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: cockpit
    volumes:
      - staging_postgres_data:/var/lib/postgresql
      - ./backend/src/main/resources/db/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d cockpit"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - staging-net

  redis:
    image: redis:7-alpine
    container_name: staging-redis
    restart: unless-stopped
    networks:
      - staging-net

  backend:
    image: ghcr.io/moezkr/cockpit-dashboard-backend:staging
    container_name: staging-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    environment:
      REDIS_HOST: redis
      COCKPIT_DB_URL: jdbc:postgresql://postgres:5432/cockpit
      COCKPIT_DB_USER: ${POSTGRES_USER:-postgres}
      COCKPIT_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      COCKPIT_ALLOWED_ORIGINS: ${COCKPIT_ALLOWED_ORIGINS:-https://staging.moezkr.site}
      COCKPIT_JWT_ISSUER: ${COCKPIT_JWT_ISSUER:-http://localhost:8081/realms/cockpit}
      COCKPIT_SERVER_PORT: 8080
      VAULT_URI: ${VAULT_URI:-http://cockpit_vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN:-root}
      COCKPIT_ADMIN_USERNAME: ${COCKPIT_ADMIN_USERNAME:-admin}
      COCKPIT_ADMIN_EMAIL: ${COCKPIT_ADMIN_EMAIL:-admin@cockpit.local}
      COCKPIT_ADMIN_PASSWORD: ${COCKPIT_ADMIN_PASSWORD:-Admin1234!}

    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - staging-net

  frontend:
    image: ghcr.io/moezkr/cockpit-dashboard-frontend:staging
    container_name: staging-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:4200:80"
    networks:
      - staging-net

networks:
  staging-net:
    driver: bridge

volumes:
  staging_postgres_data: